  <body>
    <main id="demo">
      <noscript>
        <h1>Tilter</h1>
        <p>
          A tilt-shift lens as an FFGL effect for Resolume and an OpenFX plugin
          for Resolve: a shallow plane of focus you can tilt, with a proper
          aperture behind it, so out-of-focus highlights bloom into the shape of
          the iris instead of smearing.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/tilter">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/tilter/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/tilter/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/tilter">Source on GitHub</a></li>
        </ul>
      </noscript>
